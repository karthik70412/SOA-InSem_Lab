spring.application.name=order
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.facultyService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.facultyService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.facultyService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.facultyService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.facultyService.sliding-window-size=5
# PostgreSQL - Student DB
spring.datasource.url=jdbc:postgresql://localhost:5432/student_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true